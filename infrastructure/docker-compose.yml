services:
  postgres:
    image: postgres:16-alpine
    container_name: prp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-portal}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-portal}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - prp_net

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    container_name: prp-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_password}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_dev_password}
      SPI_DB_JDBC_URL: ${SPI_DB_JDBC_URL:-jdbc:postgresql://postgres:5432/portal}
      SPI_DB_USERNAME: ${SPI_DB_USERNAME:-keycloak_spi}
      SPI_DB_PASSWORD: ${SPI_DB_PASSWORD:-keycloak_spi_dev_password}
      SPI_DB_DRIVER: ${SPI_DB_DRIVER:-org.postgresql.Driver}
      SPI_DB_SCHEMA: ${SPI_DB_SCHEMA:-identity}
      SPI_HIKARI_MAX_POOL_SIZE: ${SPI_HIKARI_MAX_POOL_SIZE:-5}
      SPI_HIKARI_MIN_IDLE: ${SPI_HIKARI_MIN_IDLE:-1}
      SPI_HIKARI_CONNECTION_TIMEOUT_MS: ${SPI_HIKARI_CONNECTION_TIMEOUT_MS:-30000}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/providers:/opt/keycloak/providers:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prp_net

  kafka:
    image: apache/kafka:3.9.1
    container_name: prp-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_HOST://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - prp_net

  redis:
    image: redis:7.4-alpine
    container_name: prp-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-redis_dev_password}
      - --maxmemory-policy
      - allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis_dev_password} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - prp_net

  camunda:
    image: camunda/camunda-bpm-platform:run-latest
    container_name: prp-camunda
    restart: unless-stopped
    environment:
      DB_DRIVER: org.postgresql.Driver
      DB_URL: jdbc:postgresql://postgres:5432/${CAMUNDA_DB_NAME:-camunda}
      DB_USERNAME: ${CAMUNDA_DB_USER:-camunda}
      DB_PASSWORD: ${CAMUNDA_DB_PASSWORD:-camunda_dev_password}
      WAIT_FOR: postgres:5432
      JAVA_OPTS: -Xms256m -Xmx512m
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - prp_net

networks:
  prp_net:
    name: prp_net
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
  redis_data:
