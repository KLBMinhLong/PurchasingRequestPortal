spring:
  application:
    name: purchasing-request-portal-backend
  profiles:
    active: dev

server:
  port: ${SERVER_PORT:8082}

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portal}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres_dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_schema: business

  mybatis:
    mapper-locations: classpath*:mybatis/**/*.xml
    type-aliases-package: com.fis.purchasing
    configuration:
      map-underscore-to-camel-case: true
      cache-enabled: false

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/purchasing-portal}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:prp-backend}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis_dev_password}
      timeout: 5s

camunda:
  bpm:
    admin-user:
      id: ${CAMUNDA_ADMIN_USER:admin}
      password: ${CAMUNDA_ADMIN_PASSWORD:admin}
      first-name: Camunda
      last-name: Admin
    filter:
      create: All tasks
    history-level: full

app:
  security:
    expected-audience: ${KEYCLOAK_CLIENT_ID:prp-backend}
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:purchasing-portal}
    client-id: ${KEYCLOAK_CLIENT_ID:prp-backend}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:change-me}

logging:
  level:
    org.springframework.security: INFO
    org.camunda.bpm: INFO
    org.mybatis: INFO
    org.hibernate.SQL: INFO
